# Alembic configuration for KingSec.
#
# This file is read by the ``alembic`` CLI and by ``env.py``.  It is NOT read
# by the KingSec application at runtime — Alembic runs as a separate process.
#
# The ``[alembic]`` section below points at the migration package inside the
# source tree so that ``alembic`` commands can be executed from the project root
# without ``cd`` gymnastics:
#
#     alembic upgrade head
#     alembic revision --autogenerate -m "add sessions table"

[alembic]
# Resolve paths from this configuration file, not from the caller's current
# working directory.  This keeps direct Alembic commands usable from any
# directory while allowing the caller's cwd to remain the source for `.env`.
script_location = %(here)s/src/kingsec/alembic
prepend_sys_path = %(here)s/src

# Template used to generate migration file names.
# Year-month-day_hour-minute-second__slug
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d%%(second).2d__%%(slug)s

# SQLAlchemy URL is set dynamically in env.py from KingSec settings.
# The value here is only used by ``alembic stamp`` when no env is available.
# Do NOT hardcode a production URL — this is a safe fallback for dev/CI only.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
