# =============================================================================
# KingSec — Continuous Integration
# =============================================================================
# Runs on every push and pull request to main/develop branches.
# Standard Python OSS pattern: setup-python → pip install → run tools.
# The frontend job mirrors that shape for the Node side: setup-node →
# npm ci → run tools. Both jobs run in parallel and both block merge.

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          # setuptools isn't a declared project dependency - it's whatever
          # version the runner image's Python bundles - so leaving it
          # unupgraded here left the 3.11 image's pre-installed setuptools
          # 79.0.1 (PYSEC-2026-3447) sitting in the environment for
          # pip-audit to find (Phase 20 §4).
          python -m pip install --upgrade pip setuptools
          pip install -e ".[dev]"

      - name: Lint (Ruff)
        run: ruff check .

      - name: Types (mypy)
        run: mypy src

      - name: Architecture (import-linter)
        run: lint-imports

      - name: Security (Bandit)
        run: bandit -q -r src

      - name: Security (pip-audit)
        run: pip-audit

      - name: Test (pytest)
        run: pytest --cov --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  frontend:
    name: Frontend Quality Gates
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint (oxlint)
        working-directory: frontend
        run: npm run lint

      - name: Types (tsc)
        working-directory: frontend
        run: npx tsc -b --noEmit

      - name: Test (vitest)
        working-directory: frontend
        run: npm test
