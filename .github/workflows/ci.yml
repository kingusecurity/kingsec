# =============================================================================
# KingSec — Continuous Integration
# =============================================================================
# Runs on every push and pull request to main/develop branches.
# Standard Python OSS pattern: setup-python → pip install → run tools.
# The frontend job mirrors that shape for the Node side: setup-node →
# npm ci → run tools. All three jobs run in parallel and all block merge.
#
# docker-build (Phase 29): before this job existed, nothing in CI ever ran
# `docker build` - a broken Dockerfile (including a broken `git archive
# HEAD` build step, see Dockerfile's own comment) could reach `main` or
# even a tagged release without any automated check ever catching it. This
# job only builds the image (no push, no run) to catch exactly that class
# of regression; it intentionally does not replace the manual/disposable
# Docker Compose verification documented in the deployment audits.

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install uv
        run: pip install uv

      - name: Verify uv.lock is up to date (Phase 40)
        run: uv lock --check

      - name: Install dependencies
        run: |
          # setuptools isn't a declared project dependency - it's whatever
          # version the runner image's Python bundles - so leaving it
          # unupgraded here left the 3.11 image's pre-installed setuptools
          # 79.0.1 (PYSEC-2026-3447) sitting in the environment for
          # pip-audit to find (Phase 20 §4).
          python -m pip install --upgrade pip setuptools
          pip install -e ".[dev]"

      - name: Lint (Ruff)
        run: ruff check .

      - name: Types (mypy)
        run: mypy src

      - name: Architecture (import-linter)
        run: lint-imports

      - name: Security (Bandit)
        run: bandit -q -r src

      - name: Security (pip-audit)
        run: pip-audit

      - name: Test (pytest)
        run: pytest --cov --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  frontend:
    name: Frontend Quality Gates
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint (oxlint)
        working-directory: frontend
        run: npm run lint

      - name: Types (tsc)
        working-directory: frontend
        run: npx tsc -b --noEmit

      - name: Test (vitest)
        working-directory: frontend
        run: npm test

  licenses:
    name: License Compliance
    runs-on: ubuntu-latest
    # Phase 5 (Task C): fails the build if a dependency's license isn't in
    # the allowlist docs/THIRD_PARTY_LICENSES.md documents. Both ecosystems
    # are checked against a RUNTIME-only dependency set (no dev/build
    # tooling) so the gate reflects what actually ships, not the full dev
    # environment - see docs/THIRD_PARTY_LICENSES.md's "Scope and
    # methodology" section for why that distinction matters here.

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install KingSec runtime deps only (no [dev] extras) into an isolated venv
        run: |
          python -m venv .runtime-venv
          .runtime-venv/bin/pip install .

      - name: Install pip-licenses (audit tool only, pinned — not part of the [dev] group)
        run: pip install pip-licenses==5.5.5

      - name: Check Python (runtime) licenses against the allowlist
        # Allowlist must match docs/THIRD_PARTY_LICENSES.md's Python table
        # exactly, including pyphen's multi-license entry (GPLv2+/LGPLv2+/
        # MPL-1.1 — allowed under the LGPLv2+/MPL-1.1 option, see that
        # doc's Copyleft section) and certifi's MPL-2.0 (weak copyleft,
        # unmodified use only). Update both together if a new license
        # needs allowing — never just one.
        run: |
          pip-licenses --python .runtime-venv/bin/python --allow-only="Apache Software License;Apache-2.0;Apache-2.0 OR BSD-3-Clause;BSD License;BSD-3-Clause;GNU General Public License v2 or later (GPLv2+); GNU Lesser General Public License v2 or later (LGPLv2+); Mozilla Public License 1.1 (MPL 1.1);MIT;MIT AND PSF-2.0;MIT License;MIT OR Apache-2.0;MIT-0;MIT-CMU;Mozilla Public License 2.0 (MPL 2.0);Other/Proprietary License;PSF-2.0;Python Software Foundation License"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Generate npm production SBOM (no devDependencies)
        working-directory: frontend
        run: npx @cyclonedx/cyclonedx-npm --omit dev --output-format JSON --output-file ../sbom-npm-ci.json

      - name: Check npm (production) licenses against the allowlist
        run: node scripts/check-npm-licenses.mjs sbom-npm-ci.json

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build image (no push, no run)
        run: docker build -t kingsec:ci-build .
