# =============================================================================
# KingSec - Project Definition & Tooling Configuration
# Single source of truth for metadata, dependencies, and dev-tool settings.
# Standards-based (PEP 621 + PEP 735) so the dependency manager stays swappable.
# =============================================================================

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "kingsec"
version = "1.1.0"
description = "Local-first, AI-augmented Attack Surface & Vulnerability Management for SMEs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary - All Rights Reserved" }
authors = [
  { name = "Abdul Mannan" },
]
keywords = ["security", "asm", "vulnerability-management", "defensive-security", "pentesting"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Information Technology",
  "Intended Audience :: System Administrators",
  "License :: Other/Proprietary License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: System :: Networking :: Monitoring",
]

# --- Runtime stack (declared for the modules ahead; foundation ships no logic) ---
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "cryptography>=42.0,<50",
  "defusedxml>=0.7.1,<1",
  "httpx>=0.27,<1",
  "structlog>=24.1,<27",
  "sqlalchemy>=2,<3",
  "weasyprint>=62.0,<70",
  "reportlab>=4.0,<6",
  "PyJWT>=2.9,<3",
  "argon2-cffi>=23.1,<26",
  "alembic>=1.13,<2",
  "python-multipart>=0.0.7,<1",
]

# --- Dev / CI toolchain (PEP 621 optional-dependencies; consumed by pip install -e ".[dev]") ---
[project.optional-dependencies]
dev = [
  "ruff>=0.6",
  "mypy>=1.11",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "pytest-asyncio>=0.23",
  "import-linter>=2.0",
  "bandit>=1.7",
  "pip-audit>=2.7",
  "pre-commit>=3.7",
  "PyPDF2>=3.0",
  "freezegun>=1.5",
]

[project.scripts]
kingsec = "kingsec.__main__:main"
kingsec-migrate = "kingsec._migrate:run_migrations"
kingsec-bootstrap = "kingsec._bootstrap:main"

[project.urls]
Homepage = "https://github.com/kingusecurity/kingsec"
Documentation = "https://github.com/kingusecurity/kingsec"
Source = "https://github.com/kingusecurity/kingsec"
Issues = "https://github.com/kingusecurity/kingsec/issues"
Changelog = "https://github.com/kingusecurity/kingsec/blob/main/CHANGELOG.md"

# --- Development toolchain (PEP 735 dependency group; not shipped, not an extra) ---
[dependency-groups]
dev = [
  "ruff>=0.6",             # Lint + format (one fast tool)
  "mypy>=1.11",            # Strict static typing
  "pytest>=8.2",           # Test runner
  "pytest-cov>=5.0",       # Coverage measurement
  "pytest-asyncio>=0.23",  # Async test support
  "import-linter>=2.0",    # Enforce hexagonal boundaries in CI
  "bandit>=1.7",           # Deeper Python SAST (defense-in-depth vs Ruff S)
  "pip-audit>=2.7",        # Dependency vulnerability scanning
  "pre-commit>=3.7",       # Local enforcement of the above before commit
]

[tool.hatch.build.targets.wheel]
packages = ["src/kingsec"]
include = ["kingsec/alembic/alembic.ini"]

# =============================================================================
# Ruff - linting + formatting
# =============================================================================
[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W",  # pycodestyle
  "F",       # pyflakes (keep: user requested)
  "I",       # isort (keep: user requested)
  "N",       # pep8-naming
  "UP",      # pyupgrade (keep: user requested)
  "B",       # flake8-bugbear (keep: user requested)
  "C4",      # comprehensions
  "TID",     # tidy-imports
  "PTH",     # prefer pathlib
  "PT",      # pytest style
  "ASYNC",   # async correctness
  "S",       # flake8-bandit (security)
  "ARG",     # unused arguments
  "RUF",     # Ruff-specific (keep: user requested)
]
ignore = [
  "COM812", # handled by the formatter
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["kingsec"]

[tool.ruff.lint.per-file-ignores]
# FastAPI Depends() in route arg defaults is the standard DI pattern, not a bug.
"src/**/web/*.py" = ["B008"]
"src/**/routes/*.py" = ["B008"]
# Tests may assert freely and use test-only patterns.
"tests/**" = [
  "S101",      # assert is fine in tests
  "S105",      # hardcoded password string (test fixtures)
  "S106",      # hardcoded password func arg (test fixtures)
  "S107",      # hardcoded password default (test fixtures)
  "S108",      # hardcoded temp file (test fixtures)
  "S104",      # hardcoded bind all interfaces (test fixtures)
  "S110",      # try-except-pass (test stubs)
  "ARG",       # unused arguments (common in test fixtures)
  "TID252",    # relative imports are acceptable in tests
  "RUF043",    # pytest raises ambiguous pattern
  "B008",      # function call in default args (common test fixtures)
  "B011",      # assert False / assert 0 (test stubs)
  "PT015",     # pytest assert always false
  "PT011",     # pytest raises too broad
  "PT012",     # pytest raises multiple statements
  "PT018",     # pytest composite assertion
  "PT017",     # pytest assert in except
  "PT019",     # pytest fixture param without value
  "PT006",     # pytest parametrize names type
  "E501",      # line length (tests often have long fixture paths)
  "N806",      # non-lowercase variable (test helpers)
  "C408",      # unnecessary collection call
  "PTH",       # os.path vs pathlib (style, not correctness)
  "ASYNC110",  # async sleep in busy-wait pattern (test event loop)
  "E741",      # ambiguous variable name (single-letter is fine in tests)
  "B015",      # pointless comparison (test assertion style)
  "B017",      # assert-raises-exception (test pattern for broad checks)
  "S306",      # mktemp — fine in test temp dirs
  "S603",      # subprocess — test harness controls args
  "N805",      # first-arg naming — test helpers not true methods
]

# Suppress noisy style rules in production code — adopt incrementally.
"src/**" = [
  "ARG",       # unused arguments (defer cleanup)
  "PTH",       # pathlib preference (defer migration)
  "E501",      # line-length (defer wrapping)
  "E402",      # module-level import ordering (defer refactor)
  "S101",      # assert in non-test — reviewed acceptable guards
  "S104",      # hardcoded bind — config default, not a prod bind
  "S105",      # hardcoded-password — false positives on enum/constant names
  "S106",      # hardcoded-password — false positive
  "S110",      # try-except-pass — to review later
  "S310",      # urlopen — notification senders validate schemes beforehand
  "S314",      # xml parse — nmap output is local/trusted
  "S603",      # subprocess — runner validates input
  "ASYNC240",  # os.path in async fn — known pattern in this codebase
  "B015",      # useless-comparison — reviewed
  "B017",      # assert-raises-exception — non-test uses are intentional
  "B027",      # empty-method — intentional abstract stubs
  "N805",      # first-arg naming — protocol implementations
  "N818",      # exception suffix — existing naming
  "N802",      # function naming — existing
  "N814",      # camelcase import — existing
  "N817",      # camelcase acronym — existing
  "E741",      # ambiguous var name — existing
  "RUF002",    # ambiguous unicode docstring — existing
  "RUF003",    # ambiguous unicode comment — existing
  "ASYNC110",  # async busy-wait — reviewed
  "C401",      # unnecessary generator — reviewed
]

# =============================================================================
# mypy - strict static typing
# =============================================================================
[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["kingsec"]
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]
exclude = [
  "alembic/versions/",
  "build/",
]

# =============================================================================
# pytest
# =============================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
asyncio_mode = "auto"
markers = [
  "unit: pure logic, no I/O",
  "integration: exercises a real local dependency",
  "contract: verifies an adapter satisfies its port",
  "e2e: drives the Service API end-to-end",
  "slow: excluded from the fast feedback loop",
]

# =============================================================================
# coverage
# =============================================================================
[tool.coverage.run]
source = ["kingsec"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

# =============================================================================
# import-linter - physical enforcement of the frozen hexagonal architecture
# =============================================================================
[tool.importlinter]
root_package = "kingsec"
include_external_packages = true
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "Hexagonal layering (dependencies point inward only)"
type = "layers"
layers = [
  "kingsec.adapters | kingsec.infrastructure",
  "kingsec.application",
  "kingsec.domain",
]

[[tool.importlinter.contracts]]
name = "Domain is pure (no frameworks, no outer layers)"
type = "forbidden"
source_modules = ["kingsec.domain"]
forbidden_modules = [
  "fastapi", "uvicorn", "httpx", "pydantic", "sqlite3",
  "kingsec.application", "kingsec.adapters", "kingsec.infrastructure",
]

[[tool.importlinter.contracts]]
name = "Application knows domain only (defines ports, imports no adapters)"
type = "forbidden"
source_modules = ["kingsec.application"]
forbidden_modules = [
  "fastapi", "uvicorn", "httpx", "sqlite3",
  "kingsec.adapters", "kingsec.infrastructure",
]
