# Alembic configuration for KingSec — packaged inside the wheel.
# This file lives inside the installed package so migrations work
# from both repository checkouts and pip-installed deployments.
#
# Usage after pip install:
#     alembic -c "$(python -c "import importlib.resources; print(importlib.resources.files('kingsec.alembic').joinpath('alembic.ini'))")" upgrade head
#
# NOTE: sqlalchemy.url is set dynamically in env.py from KingSec settings.
#       The value below is only used by ``alembic stamp`` when no env is available.

[alembic]
script_location = .
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d%%(second).2d__%%(slug)s
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
